<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cal Men's Volleyball — Flight Tracker</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#14181f; --sub:#5b616b; --line:#e3e5ea;
    --blue-solid:#003262; --blue-text:#003262; --blue-bg:#eaf0f7;
    --gold:#FDB515; --gold-solid:#7a5900; --gold-text:#8a6400; --gold-bg:#fff6e0;
    --ok-text:#1a7a34; --ok-bg:#eefbf1; --shadow:0 1px 3px rgba(20,24,31,.06),0 1px 2px rgba(20,24,31,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#181c24; --ink:#f0f2f5; --sub:#a6acb7; --line:#2a303b;
      --blue-text:#7db2ef; --blue-bg:#152840;
      --gold-text:#f2c14e; --gold-bg:#2c2410;
      --ok-text:#4fd984; --ok-bg:#10241a; --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;-webkit-font-smoothing:antialiased;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  input[type=text],input[type=date],input[type=time],input[type=number]{
    background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13px;width:100%;
    font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--blue-text);}
  label.rider{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;}
  button{font-family:inherit;}
  .btn-primary{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;transition:filter .15s,transform .1s;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-secondary{background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-secondary:hover{background:var(--line);}
  .tab-btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .link-btn{font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;}
  .link-btn:hover{background:var(--line);}
  .slot-card{transition:border-color .15s;}
  .slot-card:hover{border-color:var(--blue-text);}
</style>
</head>
<body>
<div id="app" style="max-width:900px;margin:0 auto;padding:20px 16px 60px;"></div>
<datalist id="airport-options">
  <option value="SFO">San Francisco, CA (SFO)</option>
  <option value="OAK">Oakland, CA (OAK)</option>
  <option value="SJC">San Jose, CA (SJC)</option>
  <option value="LAX">Los Angeles, CA (LAX)</option>
  <option value="BUR">Burbank, CA (BUR)</option>
  <option value="LGB">Long Beach, CA (LGB)</option>
  <option value="ONT">Ontario, CA (ONT)</option>
  <option value="SNA">Santa Ana/Orange County, CA (SNA)</option>
  <option value="SAN">San Diego, CA (SAN)</option>
  <option value="SMF">Sacramento, CA (SMF)</option>
  <option value="FAT">Fresno, CA (FAT)</option>
  <option value="PSP">Palm Springs, CA (PSP)</option>
  <option value="LAS">Las Vegas, NV (LAS)</option>
  <option value="RNO">Reno, NV (RNO)</option>
  <option value="PHX">Phoenix, AZ (PHX)</option>
  <option value="TUS">Tucson, AZ (TUS)</option>
  <option value="SEA">Seattle, WA (SEA)</option>
  <option value="PDX">Portland, OR (PDX)</option>
  <option value="BOI">Boise, ID (BOI)</option>
  <option value="SLC">Salt Lake City, UT (SLC)</option>
  <option value="DEN">Denver, CO (DEN)</option>
  <option value="ABQ">Albuquerque, NM (ABQ)</option>
  <option value="HNL">Honolulu, HI (HNL)</option>
  <option value="OGG">Kahului/Maui, HI (OGG)</option>
  <option value="ORD">Chicago O'Hare, IL (ORD)</option>
  <option value="MDW">Chicago Midway, IL (MDW)</option>
  <option value="DFW">Dallas/Fort Worth, TX (DFW)</option>
  <option value="IAH">Houston, TX (IAH)</option>
  <option value="AUS">Austin, TX (AUS)</option>
  <option value="SAT">San Antonio, TX (SAT)</option>
  <option value="MSP">Minneapolis, MN (MSP)</option>
  <option value="STL">St. Louis, MO (STL)</option>
  <option value="MCI">Kansas City, MO (MCI)</option>
  <option value="DTW">Detroit, MI (DTW)</option>
  <option value="ATL">Atlanta, GA (ATL)</option>
  <option value="MIA">Miami, FL (MIA)</option>
  <option value="MCO">Orlando, FL (MCO)</option>
  <option value="CLT">Charlotte, NC (CLT)</option>
  <option value="RDU">Raleigh-Durham, NC (RDU)</option>
  <option value="JFK">New York JFK, NY (JFK)</option>
  <option value="LGA">New York LaGuardia, NY (LGA)</option>
  <option value="EWR">Newark, NJ (EWR)</option>
  <option value="BOS">Boston, MA (BOS)</option>
  <option value="PHL">Philadelphia, PA (PHL)</option>
  <option value="DCA">Washington Reagan, DC (DCA)</option>
  <option value="IAD">Washington Dulles, VA (IAD)</option>
  <option value="BWI">Baltimore, MD (BWI)</option>
</datalist>

<script>
/* ============================================================
   SETUP: paste your Firebase Web config below (free, no card
   required). See the on-page instructions if you haven't
   created one yet — they show automatically until this is filled in.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCYKmRZxBjVTxFvPPMeLkKUMkAcqttU9NY",
  authDomain: "flight-tracker---cal-mens.firebaseapp.com",
  databaseURL: "https://flight-tracker---cal-mens-default-rtdb.firebaseio.com",
  projectId: "flight-tracker---cal-mens",
  storageBucket: "flight-tracker---cal-mens.firebasestorage.app",
  messagingSenderId: "88623727411",
  appId: "1:88623727411:web:39a79c52f1b14306b83446",
  measurementId: "G-7T3T46M4HF"
};
const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

const TEAMS = {
  A: { label: 'A Team', solid: 'var(--blue-solid)', text: 'var(--blue-text)', bg: 'var(--blue-bg)' },
  B: { label: 'B Team', solid: 'var(--gold-solid)', text: 'var(--gold-text)', bg: 'var(--gold-bg)' }
};
const SLOTS = 15;
let state = { people: {}, rides: [], tab: 'A', editing: null };
let db = null, connected = false;

function slotIds(team){ return Array.from({length:SLOTS}, (_,i)=>team+(i+1)); }
function emptyLeg(){ return {flightNum:'',from:'',to:'',depDate:'',depTime:'',arrDate:'',arrTime:''}; }
function blankPerson(id, team, slot){ return {id, team, slot, name:'', out:emptyLeg(), ret:emptyLeg(), arrived:false}; }
function allNames(){
  const out = [];
  ['A','B'].forEach(t => slotIds(t).forEach(id=>{ const p=state.people[id]; if(p&&p.name) out.push({id,name:p.name,team:t}); }));
  return out;
}

function init(){
  if(!isConfigured){ renderSetup(); return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref('tracker').on('value', snap => {
    const v = snap.val() || {};
    state.people = v.people || {};
    state.rides = v.rides ? Object.keys(v.rides).map(k => ({ key:k, ...v.rides[k] })) : [];
    connected = true;
    render();
  }, err => { connected = false; render(); });
  render();
}

function renderSetup(){
  document.getElementById('app').innerHTML = `
    <div class="card" style="padding:24px;">
      <h1 style="font-size:18px;font-weight:800;margin:0 0 10px;">🏐 One-time setup needed</h1>
      <p style="font-size:13px;color:var(--sub);line-height:1.6;">This page needs a free Firebase Realtime Database so everyone's entries sync live. Takes about 5 minutes:</p>
      <ol style="font-size:13px;line-height:1.9;color:var(--ink);padding-left:20px;">
        <li>Go to <strong>console.firebase.google.com</strong> → Add project (free, no card needed).</li>
        <li>In the project: <strong>Build → Realtime Database → Create Database</strong>. Pick any region, start in <strong>test mode</strong>.</li>
        <li>Click the <strong>Rules</strong> tab and set it to: <code style="background:var(--bg);padding:2px 6px;border-radius:4px;">{"rules": {".read": true, ".write": true}}</code>, then Publish.</li>
        <li>Go to <strong>Project settings (gear icon) → General → Your apps → Add app → Web (&lt;/&gt;)</strong>, register it, and copy the <code>firebaseConfig</code> object shown.</li>
        <li>Open <code>index.html</code> in this repo and paste those 7 values into the <code>firebaseConfig</code> block near the top, replacing the <code>YOUR_...</code> placeholders. Commit the change.</li>
      </ol>
      <p style="font-size:12px;color:var(--sub);margin-top:12px;">Note: the rule above makes the database open to anyone with its URL — fine for a low-stakes team tool, but don't put sensitive info in it.</p>
    </div>`;
}

function fmtDT(date, time){ if(!date && !time) return '—'; return (date||'?') + (time ? ' · ' + time : ''); }

function flightGroups(leg){
  const groups = {};
  ['A','B'].forEach(team => slotIds(team).forEach(id => {
    const p = state.people[id];
    if(p && p[leg] && p[leg].flightNum && p.name){
      const key = p[leg].flightNum.trim().toUpperCase();
      if(!groups[key]) groups[key] = [];
      groups[key].push({name:p.name, team, date:p[leg].depDate, time:p[leg].depTime});
    }
  }));
  return Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
}

function summaryHTML(){
  const outG = flightGroups('out'), retG = flightGroups('ret');
  const totalFilled = ['A','B'].reduce((n,t)=>n+slotIds(t).filter(id=>state.people[id]&&state.people[id].name).length,0);
  const totalArrived = ['A','B'].reduce((n,t)=>n+slotIds(t).filter(id=>state.people[id]&&state.people[id].arrived).length,0);
  const legBlock = (title, groups) => `
    <div style="flex:1;min-width:220px;">
      <div style="font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">${title}</div>
      ${groups.length===0 ? `<div style="font-size:13px;color:var(--sub);">No flights entered yet</div>` :
        groups.map(([num,people],i)=>`
          <div class="card" style="padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <div style="font-size:13px;font-weight:700;">${num} ${i===0 && people.length>1 ? '<span style=\"font-size:11px;font-weight:600;color:var(--ok-text);\">★ most booked</span>':''}</div>
              <div style="font-size:11px;color:var(--sub);margin-top:1px;">${people.map(p=>p.name+' ('+p.team+')').join(', ')}</div>
            </div>
            <div style="font-size:19px;font-weight:800;color:var(--sub);">${people.length}</div>
          </div>`).join('')}
    </div>`;
  return `
    <div class="card" style="padding:16px;margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:15px;font-weight:800;">Flight summary</div>
        <div style="font-size:12px;color:var(--sub);">${totalFilled}/30 entered · ${totalArrived}/30 arrived ${connected?'':'· <span style="color:#e5484d;">connecting…</span>'}</div>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">${legBlock('Outbound flights', outG)}${legBlock('Return flights', retG)}</div>
    </div>`;
}

function legFormHTML(leg, label, data, personId){
  const f = k => `${leg}_${k}_${personId}`;
  return `
    <div style="margin-top:10px;">
      <div style="font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:5px;">${label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
        <input type="text" id="${f('flightNum')}" placeholder="Flight #" value="${data.flightNum}">
        <input type="text" id="${f('from')}" placeholder="From (airport/city)" value="${data.from}" list="airport-options">
        <input type="text" id="${f('to')}" placeholder="To (airport/city)" value="${data.to}" style="grid-column:1 / -1;" list="airport-options">
        <div style="grid-column:1 / -1;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-top:4px;">Departs</div>
        <input type="date" id="${f('depDate')}" value="${data.depDate}">
        <input type="time" id="${f('depTime')}" value="${data.depTime}">
        <div style="grid-column:1 / -1;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-top:4px;">Arrives</div>
        <input type="date" id="${f('arrDate')}" value="${data.arrDate}">
        <input type="time" id="${f('arrTime')}" value="${data.arrTime}">
      </div>
    </div>`;
}

function cardHTML(id){
  const p = state.people[id] || blankPerson(id, id[0], id.slice(1));
  const filled = !!p.name;
  const editing = state.editing === id;
  const team = TEAMS[id[0]];
  if(editing){
    return `
      <div class="card" style="padding:16px;margin-bottom:10px;border-color:${team.text};">
        <input type="text" id="name_${id}" placeholder="Full name" value="${p.name}" style="font-weight:700;font-size:14px;margin-bottom:6px;">
        ${legFormHTML('out','Outbound leg',p.out,id)}
        ${legFormHTML('ret','Return leg',p.ret,id)}
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn-primary" onclick="savePerson('${id}')" style="background:${team.solid};">Save</button>
          <button class="btn-secondary" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>`;
  }
  return `
    <div class="card slot-card" style="padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:11px;">
      <label style="display:flex;align-items:center;cursor:${filled?'pointer':'not-allowed'};">
        <input type="checkbox" ${p.arrived?'checked':''} ${filled?'':'disabled'} onchange="toggleArrived('${id}',this.checked)" style="width:19px;height:19px;accent-color:var(--ok-text);">
      </label>
      <div style="flex:1;min-width:0;cursor:pointer;" onclick="startEdit('${id}')">
        <div style="font-size:13.5px;font-weight:700;${filled?'':'color:var(--sub);font-weight:500;'}">${filled?p.name:'Slot '+id.slice(1)+' — empty, tap to add'}</div>
        ${filled?`<div style="font-size:11px;color:var(--sub);margin-top:2px;">Out: ${p.out.flightNum||'—'} · ${fmtDT(p.out.depDate,p.out.depTime)} &nbsp;|&nbsp; Ret: ${p.ret.flightNum||'—'} · ${fmtDT(p.ret.depDate,p.ret.depTime)}</div>`:''}
      </div>
      ${p.arrived?`<span style="font-size:11px;font-weight:700;color:var(--ok-text);background:var(--ok-bg);padding:3px 10px;border-radius:999px;">Arrived</span>`:''}
      <button class="link-btn" onclick="startEdit('${id}')" style="color:${team.text};">Edit</button>
    </div>`;
}

function ridesTabHTML(){
  const names = allNames();
  const riderChecks = names.map(n=>`
    <label class="rider"><input type="checkbox" class="rider-check" value="${n.id}" style="width:15px;height:15px;accent-color:var(--blue-text);"> ${n.name} <span style="color:var(--sub);font-size:11px;">(${n.team})</span></label>`).join('');
  const addForm = `
    <div class="card" style="padding:16px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px;">Add a ride</div>
      <input type="text" id="ride_route" placeholder="Route (e.g. Airport → Hotel)" style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:7px;">Who was in this Uber?</div>
      ${names.length===0 ? `<div style="font-size:13px;color:var(--sub);margin-bottom:8px;">Add people on the A Team / B Team tabs first.</div>` : `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">${riderChecks}</div>`}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
        <input type="text" id="ride_paidby" placeholder="Paid by (name)">
        <input type="number" id="ride_price" placeholder="Total price ($)" step="0.01" min="0">
      </div>
      <button class="btn-primary" onclick="addRide()" style="background:var(--blue-solid);">Add ride</button>
    </div>`;
  const list = state.rides.length===0 ? `<div style="font-size:13px;color:var(--sub);">No rides logged yet.</div>` :
    state.rides.map(r=>`
      <div class="card" style="padding:13px 14px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
          <div>
            <div style="font-size:13.5px;font-weight:700;">${r.route || 'Uber ride'}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:3px;">Riders: ${(r.riders||[]).map(id=>{const p=state.people[id];return p?p.name:'—';}).join(', ') || '—'}</div>
            <div style="font-size:11px;color:var(--sub);">Paid by <strong style="color:var(--ink);">${r.paidBy || '—'}</strong></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:19px;font-weight:800;">$${Number(r.price||0).toFixed(2)}</div>
            <button class="link-btn" onclick="deleteRide('${r.key}')" style="color:#d3232b;margin-top:2px;">Delete</button>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;cursor:pointer;">
          <input type="checkbox" ${r.reimbursed?'checked':''} onchange="toggleReimbursed('${r.key}',this.checked)" style="width:16px;height:16px;accent-color:var(--ok-text);">
          ${r.reimbursed ? `<span style="color:var(--ok-text);font-weight:700;">Reimbursed to ${r.paidBy||'payer'}</span>` : `Mark $${Number(r.price||0).toFixed(2)} reimbursed to ${r.paidBy||'payer'}`}
        </label>
      </div>`).join('');
  return `${addForm}<div style="font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:8px;">Logged rides (${state.rides.length})</div>${list}`;
}

function addRide(){
  const route = (document.getElementById('ride_route')||{}).value || '';
  const paidBy = (document.getElementById('ride_paidby')||{}).value || '';
  const price = parseFloat((document.getElementById('ride_price')||{}).value || '0') || 0;
  const riders = Array.from(document.querySelectorAll('.rider-check:checked')).map(el=>el.value);
  db.ref('tracker/rides').push({route, paidBy, price, riders, reimbursed:false});
}
function toggleReimbursed(key, val){ db.ref('tracker/rides/'+key+'/reimbursed').set(val); }
function deleteRide(key){ if(!confirm("Delete this ride? This can't be undone.")) return; db.ref('tracker/rides/'+key).remove(); }

function render(){
  if(!isConfigured) return;
  const app = document.getElementById('app');
  const tab = state.tab;
  const tabs = [
    {id:'A', label:TEAMS.A.label, text:TEAMS.A.text, bg:TEAMS.A.bg},
    {id:'B', label:TEAMS.B.label, text:TEAMS.B.text, bg:TEAMS.B.bg},
    {id:'U', label:'🚗 Group Ubers', text:'var(--blue-text)', bg:'var(--gold-bg)'}
  ];
  app.innerHTML = `
    <div style="background:var(--blue-solid);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🏐</div>
      <div>
        <div style="font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);">UC Berkeley</div>
        <h1 style="font-size:20px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em;">Cal Men's Volleyball — Flight Tracker</h1>
      </div>
    </div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:16px;">Everyone on the roster fills in their own row below. Updates sync live for anyone with this link.</div>
    ${tab!=='U' ? summaryHTML() : ''}
    <div style="display:flex;gap:7px;margin-bottom:16px;">
      ${tabs.map(t=>`<button class="tab-btn" onclick="setTab('${t.id}')" style="border:1.5px solid ${tab===t.id?t.text:'var(--line)'};background:${tab===t.id?t.bg:'var(--card)'};color:${tab===t.id?t.text:'var(--ink)'};">${t.label}</button>`).join('')}
    </div>
    <div>${tab==='U' ? ridesTabHTML() : slotIds(tab).map(cardHTML).join('')}</div>
  `;
}

function setTab(t){ state.tab = t; state.editing = null; render(); }
function startEdit(id){ state.editing = id; render(); setTimeout(()=>{ const el=document.getElementById('name_'+id); if(el) el.focus(); },0); }
function cancelEdit(){ state.editing = null; render(); }

function readLegFields(leg, id){
  const g = k => { const el = document.getElementById(leg+'_'+k+'_'+id); return el ? el.value : ''; };
  return { flightNum:g('flightNum'), from:g('from'), to:g('to'), depDate:g('depDate'), depTime:g('depTime'), arrDate:g('arrDate'), arrTime:g('arrTime') };
}

function savePerson(id){
  const name = (document.getElementById('name_'+id)||{}).value || '';
  const existing = state.people[id] || {};
  const data = { name: name.trim(), team: id[0], slot: Number(id.slice(1)), out: readLegFields('out', id), ret: readLegFields('ret', id), arrived: !!existing.arrived };
  state.people[id] = data;
  state.editing = null;
  render();
  db.ref('tracker/people/'+id).set(data).catch(err => alert('Could not save: ' + err.message));
}

function toggleArrived(id, val){ db.ref('tracker/people/'+id+'/arrived').set(val); }

init();
</script>
</body>
</html>
